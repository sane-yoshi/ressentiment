<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>BLOG test| ressentiment</title>


  <style>

    :root {
      --bg: #f3f0e6;
      --mint: #a8cdbd;
      --green: #243b36;
      --blue: #456A72;
      --line: #b8c8bd;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      background: var(--bg);

      color: var(--green);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      line-height: 1.8;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    a:hover {
      opacity: 0.6;
    }


    /* ---------- header ---------- */


    header {
      background-color: var(--mint);

      background-image:
        radial-gradient(
          circle at 15% 25%,
          rgba(243, 240, 230, 0.45) 0 2px,
          transparent 3px
        ),

        radial-gradient(
          circle at 80% 70%,
          rgba(243, 240, 230, 0.35) 0 3px,
          transparent 4px
        ),

        radial-gradient(
          circle at 65% 20%,
          rgba(243, 240, 230, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;

      padding: 65px 25px 45px;

      text-align: center;
    }


    .site-title {
      display: inline-block;
    }


    .site-title h1 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size:
        clamp(3rem, 8vw, 5.5rem);

      font-weight: normal;

      letter-spacing: 0.04em;

      color: #456A72;
    }


    nav {
      margin-top: 35px;

      display: flex;

      gap: 30px;

      flex-wrap: wrap;

      justify-content: center;
    }


    nav a {
      color: #456A72;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.9rem;

      letter-spacing: 0.12em;
    }


    /* ---------- main ---------- */


    main {
      max-width: 960px;

      margin: 0 auto;

      padding: 70px 25px 100px;

      background-image:
        radial-gradient(
          circle at 12% 18%,
          rgba(168, 205, 189, 0.45) 0 2px,
          transparent 3px
        ),

        radial-gradient(
          circle at 86% 72%,
          rgba(168, 205, 189, 0.35) 0 3px,
          transparent 4px
        ),

        radial-gradient(
          circle at 65% 35%,
          rgba(168, 205, 189, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;
    }


    .page-title {
      margin-bottom: 40px;
    }


    .page-title h2 {
      margin: 0;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 2rem;

      font-weight: normal;

      letter-spacing: 0.08em;

      color: var(--blue);
    }


    .page-title p {
      margin: 3px 0 0;

      color: var(--blue);

      font-size: 0.7rem;
    }


    /* ---------- category ---------- */


    .filters {
      display: flex;

      justify-content: center;

      gap: 10px;

      flex-wrap: wrap;

      margin-bottom: 45px;
    }


    .filter {
      border:
        1px solid var(--line);

      background: transparent;

      color: var(--blue);

      padding: 7px 16px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.75rem;

      letter-spacing: 0.08em;

      cursor: pointer;
    }


    .filter:hover,
    .filter.active {
      background: var(--mint);
    }


    /* ---------- blog list ---------- */


    .blog-list {
      max-width: 760px;

      margin: 0 auto;
    }


    .blog {
      display: block;

      padding:
        22px 5px 25px;

      border-bottom:
        1px dotted var(--line);

      cursor: pointer;
    }


    .blog:first-child {
      border-top:
        1px dotted var(--line);
    }


    .blog:hover {
      opacity: 0.65;
    }


    .blog-date {
      color: var(--blue);

      font-size: 0.72rem;

      letter-spacing: 0.08em;

      margin-bottom: 3px;
    }


    .blog-title {
      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 1.25rem;

      color: var(--green);

      margin-bottom: 5px;
    }


    .blog-category {
      display: inline-block;

      color: var(--blue);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.68rem;

      letter-spacing: 0.08em;
    }


    .loading {
      text-align: center;

      color: var(--blue);

      font-size: 0.8rem;

      padding: 40px 0;
    }


    .error {
      text-align: center;

      color: var(--blue);

      font-size: 0.8rem;

      padding: 40px 0;
    }


    /* ---------- footer ---------- */


    footer {
      max-width: 960px;

      margin: 0 auto;

      padding:
        30px 25px 55px;

      border-top:
        1px solid var(--line);

      color: var(--blue);

      font-size: 0.7rem;

      letter-spacing: 0.12em;
    }


    /* ---------- mobile ---------- */


    @media (max-width: 600px) {

      header {
        padding-top: 35px;
      }


      .site-title h1 {
        font-size: 2.4rem;
      }


      nav {
        gap: 18px;
      }


      main {
        padding-top: 50px;

        padding-bottom: 60px;
      }


      .blog {
        padding:
          18px 2px 21px;
      }


      .blog-title {
        font-size: 1.1rem;
      }

    }

  </style>

</head>


<body>


  <header>

    <a
      href="index.html"
      class="site-title"
    >

      <h1>ressentiment</h1>

    </a>


    <nav>

      <a href="illust.html">
        ILLUST
      </a>

      <a href="novel.html">
        NOVEL
      </a>

      <a href="blog.html">
        BLOG
      </a>

      <a href="circle.html">
        CIRCLE
      </a>

    </nav>

  </header>


  <main>


    <div class="page-title">

      <h2>BLOG</h2>

      <p>新しい順に掲載</p>

    </div>


    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
      >
        ALL
      </button>

      <button
        class="filter"
        data-filter="日記"
      >
        日記
      </button>

      <button
        class="filter"
        data-filter="進捗"
      >
        進捗
      </button>

      <button
        class="filter"
        data-filter="インパ"
      >
        インパ
      </button>

    </div>


    <div
      class="blog-list"
      id="blog-list"
    >

      <div class="loading">
        読み込み中……
      </div>

    </div>


  </main>


  <footer>

    © saneyoshi / ressentiment

  </footer>


  <script>


    const blogList =
      document.getElementById(
        "blog-list"
      );


    const githubApi =
      "https://api.github.com/repos/sane-yoshi/ressentiment/contents/blogs";


    let posts = [];


    /* ---------- front matterを読む ---------- */


    function parseFrontMatter(
      text
    ) {

      const match =
        text.match(
          /^---\s*([\s\S]*?)\s*---\s*([\s\S]*)$/
        );


      if (!match) {

        return {
          title: "無題",
          date: "",
          category: "その他",
          body: text
        };

      }


      const frontMatter =
        match[1];

      const body =
        match[2];


      const data = {};


      frontMatter
        .split("\n")
        .forEach(line => {

          const index =
            line.indexOf(":");


          if (index === -1) {
            return;
          }


          const key =
            line
              .slice(0, index)
              .trim();


          const value =
            line
              .slice(index + 1)
              .trim();


          data[key] =
            value;

        });


      return {

        title:
          data.title || "無題",

        date:
          data.date || "",

        category:
          data.category || "その他",

        body

      };

    }


    /* ---------- 日付を表示 ---------- */


    function formatDate(
      date
    ) {

      if (!date) {
        return "";
      }


      return date
        .replaceAll("-", ".");
    }


    /* ---------- 記事を取得 ---------- */


    async function loadPosts() {

      try {

        const response =
          await fetch(
            githubApi
          );


        if (!response.ok) {
          throw new Error();
        }


        const files =
          await response.json();


        const markdownFiles =
          files.filter(
            file =>
              file.name
                .toLowerCase()
                .endsWith(".md")
          );


        posts =
          await Promise.all(

            markdownFiles.map(
              async file => {

                const textResponse =
                  await fetch(
                    file.download_url
                  );


                const text =
                  await textResponse.text();


                const data =
                  parseFrontMatter(
                    text
                  );


                return {

                  ...data,

                  file:
                    file.name

                };

              }
            )

          );


        posts.sort(
          (a, b) =>
            b.date.localeCompare(
              a.date
            )
        );


        renderPosts();

      }

          catch (error) {

      blogList.innerHTML =
        `
        <div class="error">
          記事を読み込めませんでした。<br><br>
          ${error.message}
        </div>
        `;

      console.error(error);

    }

    }


    /* ---------- 一覧を作成 ---------- */


    function renderPosts(
      filter = "all"
    ) {

      blogList.innerHTML = "";


      const filtered =
        posts.filter(
          post =>
            filter === "all" ||
            post.category === filter
        );


      if (
        filtered.length === 0
      ) {

        blogList.innerHTML =
          `
          <div class="loading">
            記事がありません。
          </div>
          `;

        return;

      }


      filtered.forEach(
        post => {


          const article =
            document.createElement(
              "article"
            );


          article.className =
            "blog";


          article.dataset.category =
            post.category;


          const date =
            document.createElement(
              "div"
            );


          date.className =
            "blog-date";


          date.textContent =
            formatDate(
              post.date
            );


          const title =
            document.createElement(
              "div"
            );


          title.className =
            "blog-title";


          title.textContent =
            post.title;


          const category =
            document.createElement(
              "div"
            );


          category.className =
            "blog-category";


          category.textContent =
            post.category;


          article.appendChild(
            date
          );


          article.appendChild(
            title
          );


          article.appendChild(
            category
          );


          article.addEventListener(
            "click",
            () => {

              window.location.href =
                "blog-viewer.html?file=" +
                encodeURIComponent(
                  post.file
                );

            }
          );


          blogList.appendChild(
            article
          );

        }
      );

    }


    /* ---------- フィルター ---------- */


    document
      .querySelectorAll(
        ".filter"
      )
      .forEach(
        filter => {

          filter.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".filter"
                )
                .forEach(
                  item =>
                    item.classList.remove(
                      "active"
                    )
                );


              filter.classList.add(
                "active"
              );


              renderPosts(
                filter.dataset.filter
              );

            }
          );

        }
      );


    loadPosts();


  </script>


</body>

</html>
