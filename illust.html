  <script>

    /* ==================================================
       gallery creation
       ================================================== */

    const gallery =
      document.getElementById("gallery");


    illustrations.forEach(
      (item, index) => {


        const figure =
          document.createElement("figure");


        figure.className =
          "work";


        if (item.r18) {

          figure.classList.add("r18");

        }


        figure.dataset.category =
          item.category;


        /* ---------- frame ---------- */

        const frame =
          document.createElement("div");


        frame.className =
          "work-frame";


        /* ---------- image ---------- */

        const image =
          document.createElement("img");


        image.src =
          item.image;


        image.alt =
          item.title;


        image.className =
          "work-image";


        frame.appendChild(
          image
        );


        /* ---------- R18 label ---------- */

        if (item.r18) {


          const r18Label =
            document.createElement("div");


          r18Label.className =
            "r18-label";


          r18Label.textContent =
            "R18";


          frame.appendChild(
            r18Label
          );

        }


        /* ---------- caption ---------- */

        const caption =
          document.createElement(
            "figcaption"
          );


        caption.textContent =
          item.title;


        figure.appendChild(
          frame
        );


        figure.appendChild(
          caption
        );


        gallery.appendChild(
          figure
        );


        /* ==================================================
           x / y の計算

           画像をまず object-fit: cover と同じ比率で
           正方形の枠いっぱいになるサイズにする。

           そのあと zoom をかけたサイズを直接指定。

           これによって、
           画像の縦横比が違っても
           サムネイル枠から余白が出ないようにする。
           ================================================== */

        function updateImagePosition() {

          const frameWidth =
            frame.clientWidth;

          const frameHeight =
            frame.clientHeight;


          if (
            frameWidth === 0 ||
            frameHeight === 0
          ) {

            return;

          }


          const naturalWidth =
            image.naturalWidth;

          const naturalHeight =
            image.naturalHeight;


          if (
            !naturalWidth ||
            !naturalHeight
          ) {

            return;

          }


          /*
           * object-fit: cover と同じ計算。

           * 画像が枠を完全に覆うために
           * 必要な倍率を求める。
           */

          const coverScale =
            Math.max(
              frameWidth / naturalWidth,
              frameHeight / naturalHeight
            );


          /*
           * cover後の基本サイズ
           */

          const baseWidth =
            naturalWidth * coverScale;


          const baseHeight =
            naturalHeight * coverScale;


          /*
           * zoom後の実際の画像サイズ
           */

          const zoom =
            Number(item.zoom ?? 1);


          const imageWidth =
            baseWidth * zoom;


          const imageHeight =
            baseHeight * zoom;


          /*
           * 枠からはみ出している量。

           * これが実際の移動可能範囲。
           */

          const moveX =
            Math.max(
              0,
              imageWidth - frameWidth
            );


          const moveY =
            Math.max(
              0,
              imageHeight - frameHeight
            );


          /*
           * x / y を0〜100に制限
           */

          const x =
            Math.min(
              100,
              Math.max(
                0,
                Number(item.x ?? 50)
              )
            );


          const y =
            Math.min(
              100,
              Math.max(
                0,
                Number(item.y ?? 50)
              )
            );


          /*
           * 中央からの移動量に変換。

           * x: 0   → 左側を表示
           * x: 50  → 中央を表示
           * x: 100 → 右側を表示

           * y: 0   → 上側を表示
           * y: 50  → 中央を表示
           * y: 100 → 下側を表示

           * 「見せたい場所」と
           * 「画像を動かす方向」は逆なので、
           * 0.5 - x / 100
           * 0.5 - y / 100
           * とする。
           */

          const offsetX =
            (0.5 - x / 100) * moveX;


          const offsetY =
            (0.5 - y / 100) * moveY;


          /*
           * 画像そのものの表示サイズを指定。

           * これにより object-fit と
           * transform の二重計算を避ける。
           */

          image.style.width =
            imageWidth + "px";


          image.style.height =
            imageHeight + "px";


          image.style.position =
            "absolute";


          image.style.left =
            "50%";


          image.style.top =
            "50%";


          /*
           * 画像を移動。

           * x / y の0〜100は
           * 実際の可動範囲そのもの。
           */

          image.style.transform =
            "translate(-50%, -50%) " +
            "translate(" +
            offsetX +
            "px, " +
            offsetY +
            "px)";

        }


        /*
         * 画像読み込み後に計算
         */

        if (image.complete) {

          updateImagePosition();

        } else {

          image.addEventListener(
            "load",
            updateImagePosition
          );

        }


        /*
         * 画面サイズ変更時にも再計算
         */

        window.addEventListener(
          "resize",
          updateImagePosition
        );

      }
    );


    /* ==================================================
       elements
       ================================================== */

    const works =
      Array.from(
        document.querySelectorAll(
          ".work"
        )
      );


    const filters =
      document.querySelectorAll(
        ".filter"
      );


    const lightbox =
      document.getElementById(
        "lightbox"
      );


    const lightboxImage =
      document.getElementById(
        "lightbox-image"
      );


    const r18Confirm =
      document.getElementById(
        "r18-confirm"
      );


    const r18View =
      document.getElementById(
        "r18-view"
      );


    const r18Back =
      document.getElementById(
        "r18-back"
      );


    const close =
      document.getElementById(
        "close"
      );


    const prev =
      document.getElementById(
        "prev"
      );


    const next =
      document.getElementById(
        "next"
      );


    let visibleWorks =
      works;


    let currentIndex =
      0;


    /* ==================================================
       category filter
       ================================================== */

    filters.forEach(
      filter => {

        filter.addEventListener(
          "click",
          () => {


            filters.forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


            filter.classList.add(
              "active"
            );


            const category =
              filter.dataset.filter;


            works.forEach(
              work => {

                if (
                  category === "all" ||
                  work.dataset.category ===
                    category
                ) {

                  work.style.display =
                    "";

                } else {

                  work.style.display =
                    "none";

                }

              }
            );


            visibleWorks =
              works.filter(
                work => {

                  return (
                    work.style.display !==
                    "none"
                  );

                }
              );

          }
        );

      }
    );


    /* ==================================================
       open lightbox
       ================================================== */

    works.forEach(
      work => {

        work.addEventListener(
          "click",
          () => {


            visibleWorks =
              works.filter(
                item => {

                  return (
                    item.style.display !==
                    "none"
                  );

                }
              );


            currentIndex =
              visibleWorks.indexOf(
                work
              );


            showCurrentWork();


            lightbox.classList.add(
              "show"
            );


            document.body.style.overflow =
              "hidden";

          }
        );

      }
    );


    /* ==================================================
       show current work
       ================================================== */

    function showCurrentWork() {

      const work =
        visibleWorks[currentIndex];


      if (!work) {

        return;

      }


      const image =
        work.querySelector(
          ".work-image"
        );


      const isR18 =
        work.classList.contains(
          "r18"
        );


      if (isR18) {


        /*
         * R18作品に到達するたび、
         * 必ず確認画面を表示。
         */

        lightboxImage.style.display =
          "none";


        r18Confirm.classList.add(
          "show"
        );


      } else {


        r18Confirm.classList.remove(
          "show"
        );


        lightboxImage.style.display =
          "block";


        lightboxImage.src =
          image.src;


        lightboxImage.alt =
          image.alt;

      }

    }


    /* ==================================================
       show R18 image
       ================================================== */

    r18View.addEventListener(
      "click",
      () => {


        const work =
          visibleWorks[currentIndex];


        if (!work) {

          return;

        }


        const image =
          work.querySelector(
            ".work-image"
          );


        lightboxImage.src =
          image.src;


        lightboxImage.alt =
          image.alt;


        r18Confirm.classList.remove(
          "show"
        );


        lightboxImage.style.display =
          "block";

      }
    );


    /* ==================================================
       R18 back
       ================================================== */

    r18Back.addEventListener(
      "click",
      () => {

        closeLightbox();

      }
    );


    /* ==================================================
       close
       ================================================== */

    close.addEventListener(
      "click",
      closeLightbox
    );


    lightbox.addEventListener(
      "click",
      event => {


        if (
          event.target === lightbox
        ) {

          closeLightbox();

        }

      }
    );


    function closeLightbox() {

      lightbox.classList.remove(
        "show"
      );


      r18Confirm.classList.remove(
        "show"
      );


      lightboxImage.style.display =
        "block";


      lightboxImage.src =
        "";


      document.body.style.overflow =
        "";

    }


    /* ==================================================
       previous
       ================================================== */

    prev.addEventListener(
      "click",
      event => {


        event.stopPropagation();


        if (
          visibleWorks.length === 0
        ) {

          return;

        }


        currentIndex =
          (
            currentIndex
            - 1
            + visibleWorks.length
          )
          % visibleWorks.length;


        showCurrentWork();

      }
    );


    /* ==================================================
       next
       ================================================== */

    next.addEventListener(
      "click",
      event => {


        event.stopPropagation();


        if (
          visibleWorks.length === 0
        ) {

          return;

        }


        currentIndex =
          (
            currentIndex
            + 1
          )
          % visibleWorks.length;


        showCurrentWork();

      }
    );


    /* ==================================================
       keyboard
       ================================================== */

    document.addEventListener(
      "keydown",
      event => {


        if (
          !lightbox.classList.contains(
            "show"
          )
        ) {

          return;

        }


        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          prev.click();

        }


        if (
          event.key === "ArrowRight"
        ) {

          next.click();

        }

      }
    );

  </script>


</body>
</html>
