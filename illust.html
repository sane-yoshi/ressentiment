<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ILLUST | ressentiment</title>

  <style>
    :root {
      --bg: #f3f0e6;
      --mint: #a8cdbd;
      --green: #243b36;
      --blue: #456A72;
      --line: #b8c8bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--green);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.6;
    }

    /* ---------- header ---------- */

    header {
      background-color: var(--mint);

      background-image:
        radial-gradient(
          circle at 15% 25%,
          rgba(243, 240, 230, 0.45) 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(243, 240, 230, 0.35) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 65% 20%,
          rgba(243, 240, 230, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;

      padding: 65px 25px 45px;
      text-align: center;
    }

    .site-title {
      display: inline-block;
    }

    .site-title h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: normal;
      letter-spacing: 0.04em;
      color: var(--blue);
    }

    nav {
      margin-top: 35px;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }

    /* ---------- main ---------- */

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 70px 25px 100px;

      background-image:
        radial-gradient(
          circle at 12% 18%,
          rgba(168, 205, 189, 0.45) 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 86% 72%,
          rgba(168, 205, 189, 0.35) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 65% 35%,
          rgba(168, 205, 189, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;
    }

    .page-title {
      margin-bottom: 60px;
    }

    .page-title h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--blue);
    }

    .page-title p {
      margin: 3px 0 0;
      color: var(--blue);
      font-size: 0.7rem;
    }

    /* ---------- gallery ---------- */

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 35px;
    }

    .work {
      margin: 0;
    }

    .work img {
      width: 100%;
      height: auto;
      display: block;
    }

    .work figcaption {
      padding-top: 10px;
      font-size: 0.75rem;
      color: var(--blue);
    }

    /* ---------- footer ---------- */

    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 25px 55px;
      border-top: 1px solid var(--line);
      color: var(--blue);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
    }

    /* ---------- mobile ---------- */

    @media (max-width: 600px) {

      header {
        padding-top: 35px;
      }

      .site-title h1 {
        font-size: 2.4rem;
      }

      nav {
        gap: 18px;
      }

      main {
        padding-top: 50px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 45px;
      }
    }
  </style>
</head>

<body>

  <header>

    <a href="index.html" class="site-title">
      <h1>ressentiment</h1>
    </a>

    <nav>
      <a href="illust.html">ILLUST</a>
      <a href="novel.html">NOVEL</a>
      <a href="blog.html">BLOG</a>
      <a href="circle.html">CIRCLE</a>
    </nav>

  </header>


  <main>

    <div class="page-title">
      <h2>ILLUST</h2>
      <p>illustration</p>
    </div>


    <div class="gallery">

      <!-- 作品をここに追加していく -->

      <figure class="work">
        <img src="images/illust01.jpg" alt="">
        <figcaption>title</figcaption>
      </figure>

      <figure class="work">
        <img src="images/illust02.jpg" alt="">
        <figcaption>title</figcaption>
      </figure>

    </div>

  </main>


  <footer>
    © saneyoshi / ressentiment
  </footer>

</body>
</html>
