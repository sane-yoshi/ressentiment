<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ILLUST | ressentiment</title>

  <!-- ==================================================
       作品を追加・編集するときは
       このページ上部の「作品データ」だけ触ればOK。
       ================================================== -->

  <script>

    const illustrations = [

      /* ---------- 作品01 ---------- */

      {
        image: "images/illust01.JPG",

        /* ジャンル：
           "goofy-max" または "other" */
        category: "goofy-max",

        /* 作品タイトル */
        title: "title",

        /* サムネイルの拡大率 */
        zoom: 3,

        /* サムネイルの左右位置
           0 = 左
           50 = 中央
           100 = 右 */
        x: 50,

        /* サムネイルの上下位置
           0 = 上
           50 = 中央
           100 = 下 */
        y: -30
      }


      /* ---------- 作品を追加する場合 ----------

      作品01の } の後ろに「,」を付けて、

      ,
      {
        image: "images/illust02.JPG",
        category: "goofy-max",
        title: "title",
        zoom: 1.5,
        x: 50,
        y: 50
      }

      のように追加する。

      ------------------------------------------ */

    ];

  </script>


  <style>

    :root {
      --bg: #f3f0e6;
      --mint: #a8cdbd;
      --green: #243b36;
      --blue: #456A72;
      --line: #b8c8bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--green);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.6;
    }


    /* ---------- header ---------- */

    header {
      background-color: var(--mint);

      background-image:
        radial-gradient(
          circle at 15% 25%,
          rgba(243, 240, 230, 0.45) 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(243, 240, 230, 0.35) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 65% 20%,
          rgba(243, 240, 230, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;

      padding: 65px 25px 45px;
      text-align: center;
    }

    .site-title {
      display: inline-block;
    }

    .site-title h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: normal;
      letter-spacing: 0.04em;
      color: var(--blue);
    }

    nav {
      margin-top: 35px;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }


    /* ---------- main ---------- */

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 70px 25px 100px;

      background-image:
        radial-gradient(
          circle at 12% 18%,
          rgba(168, 205, 189, 0.45) 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 86% 72%,
          rgba(168, 205, 189, 0.35) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 65% 35%,
          rgba(168, 205, 189, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;
    }

    .page-title {
      margin-bottom: 40px;
    }

    .page-title h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--blue);
    }

    .page-title p {
      margin: 3px 0 0;
      color: var(--blue);
      font-size: 0.7rem;
    }


    /* ---------- category ---------- */

    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 45px;
    }

    .filter {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--blue);
      padding: 7px 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .filter:hover,
    .filter.active {
      background: var(--mint);
    }


    /* ---------- gallery ---------- */

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .work {
      margin: 0;
      cursor: pointer;
    }

    /* 正方形の枠 */

    .work-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #e8e5db;
    }

    /* 枠の中で画像を拡大・移動 */

    .work-image {
      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position:
        var(--x, 50%)
        var(--y, 50%);

      transform:
        scale(var(--zoom, 1));

      display: block;

      transition: opacity 0.2s ease;
    }

    .work:hover .work-image {
      opacity: 0.75;
    }

    .work figcaption {
      padding-top: 8px;
      color: var(--blue);
      font-size: 0.72rem;
    }


    /* ---------- lightbox ---------- */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(36, 59, 54, 0.88);
      padding: 30px;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 拡大表示では元画像をそのまま表示 */

    .lightbox-image {
      max-width: 82vw;
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .close {
      position: fixed;
      top: 20px;
      right: 25px;

      border: none;
      background: none;
      color: var(--bg);

      font-size: 2rem;
      font-weight: normal;
      cursor: pointer;
    }

    .prev,
    .next {
      position: fixed;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: none;
      color: var(--bg);

      font-size: 2rem;
      cursor: pointer;
      padding: 20px;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }


    /* ---------- footer ---------- */

    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 25px 55px;

      border-top: 1px solid var(--line);

      color: var(--blue);

      font-size: 0.7rem;

      letter-spacing: 0.12em;
    }


    /* ---------- mobile ---------- */

    @media (max-width: 600px) {

      header {
        padding-top: 35px;
      }

      .site-title h1 {
        font-size: 2.4rem;
      }

      nav {
        gap: 18px;
      }

      main {
        padding-top: 50px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .work figcaption {
        font-size: 0.68rem;
      }

      .lightbox {
        padding: 15px;
      }

      .lightbox-image {
        max-width: 90vw;
        max-height: 80vh;
      }

      .prev,
      .next {
        font-size: 1.5rem;
        padding: 10px;
      }

    }

  </style>

</head>


<body>


  <header>

    <a href="index.html" class="site-title">
      <h1>ressentiment</h1>
    </a>

    <nav>

      <a href="illust.html">ILLUST</a>

      <a href="novel.html">NOVEL</a>

      <a href="blog.html">BLOG</a>

      <a href="circle.html">CIRCLE</a>

    </nav>

  </header>


  <main>


    <div class="page-title">

      <h2>ILLUST</h2>

      <p>illustration</p>

    </div>


    <!-- category filter -->

    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
      >
        ALL
      </button>

      <button
        class="filter"
        data-filter="goofy-max"
      >
        Goofy &amp; Max
      </button>

      <button
        class="filter"
        data-filter="other"
      >
        Other
      </button>

    </div>


    <!-- gallery -->

    <div
      class="gallery"
      id="gallery"
    ></div>


  </main>


  <!-- lightbox -->

  <div
    class="lightbox"
    id="lightbox"
  >

    <button
      class="close"
      id="close"
    >
      ×
    </button>

    <button
      class="prev"
      id="prev"
    >
      ‹
    </button>

    <div class="lightbox-content">

      <img
        src=""
        alt=""
        class="lightbox-image"
        id="lightbox-image"
      >

    </div>

    <button
      class="next"
      id="next"
    >
      ›
    </button>

  </div>


  <footer>

    © saneyoshi / ressentiment

  </footer>


  <script>

    /* ---------- gallery creation ---------- */

    const gallery =
      document.getElementById("gallery");


    illustrations.forEach((item, index) => {

      const figure =
        document.createElement("figure");

      figure.className = "work";

      figure.dataset.category =
        item.category;


      const frame =
        document.createElement("div");

      frame.className = "work-frame";


      const image =
        document.createElement("img");

      image.src =
        item.image;

      image.alt =
        item.title;

      image.className =
        "work-image";


      image.style.setProperty(
        "--zoom",
        item.zoom
      );

      image.style.setProperty(
        "--x",
        item.x + "%"
      );

      image.style.setProperty(
        "--y",
        item.y + "%"
      );


      frame.appendChild(image);


      const caption =
        document.createElement("figcaption");

      caption.textContent =
        item.title;


      figure.appendChild(frame);

      figure.appendChild(caption);

      gallery.appendChild(figure);

    });


    /* ---------- works ---------- */

    const works =
      Array.from(
        document.querySelectorAll(".work")
      );

    const filters =
      document.querySelectorAll(".filter");

    const lightbox =
      document.getElementById("lightbox");

    const lightboxImage =
      document.getElementById("lightbox-image");

    const close =
      document.getElementById("close");

    const prev =
      document.getElementById("prev");

    const next =
      document.getElementById("next");


    let visibleWorks = works;

    let currentIndex = 0;


    /* ---------- category filter ---------- */

    filters.forEach(filter => {

      filter.addEventListener(
        "click",
        () => {

          filters.forEach(item => {

            item.classList.remove(
              "active"
            );

          });


          filter.classList.add(
            "active"
          );


          const category =
            filter.dataset.filter;


          works.forEach(work => {

            if (
              category === "all" ||
              work.dataset.category === category
            ) {

              work.style.display = "";

            } else {

              work.style.display = "none";

            }

          });


          visibleWorks =
            works.filter(work => {

              return (
                work.style.display !== "none"
              );

            });

        }
      );

    });


    /* ---------- open lightbox ---------- */

    works.forEach(work => {

      work.addEventListener(
        "click",
        () => {

          visibleWorks =
            works.filter(item => {

              return (
                item.style.display !== "none"
              );

            });


          currentIndex =
            visibleWorks.indexOf(work);


          showImage();


          lightbox.classList.add(
            "show"
          );


          document.body.style.overflow =
            "hidden";

        }
      );

    });


    /* ---------- show image ---------- */

    function showImage() {

      const work =
        visibleWorks[currentIndex];


      const image =
        work.querySelector("img");


      lightboxImage.src =
        image.src;


      lightboxImage.alt =
        image.alt;

    }


    /* ---------- close ---------- */

    close.addEventListener(
      "click",
      closeLightbox
    );


    lightbox.addEventListener(
      "click",
      event => {

        if (
          event.target === lightbox
        ) {

          closeLightbox();

        }

      }
    );


    function closeLightbox() {

      lightbox.classList.remove(
        "show"
      );

      document.body.style.overflow =
        "";

    }


    /* ---------- previous ---------- */

    prev.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (
          visibleWorks.length === 0
        ) {

          return;

        }


        currentIndex =
          (
            currentIndex
            - 1
            + visibleWorks.length
          )
          % visibleWorks.length;


        showImage();

      }
    );


    /* ---------- next ---------- */

    next.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (
          visibleWorks.length === 0
        ) {

          return;

        }


        currentIndex =
          (
            currentIndex
            + 1
          )
          % visibleWorks.length;


        showImage();

      }
    );


    /* ---------- keyboard ---------- */

    document.addEventListener(
      "keydown",
      event => {

        if (
          !lightbox.classList.contains(
            "show"
          )
        ) {

          return;

        }


        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          prev.click();

        }


        if (
          event.key === "ArrowRight"
        ) {

          next.click();

        }

      }
    );

  </script>


</body>
</html>
