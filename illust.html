<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ILLUST | ressentiment</title>

  <!-- ==================================================
       作品を追加・編集するときは
       このページ上部の「作品データ」だけ触ればOK。

       ★ 新しい作品を一番上に追加してください。
          左上が最新の作品になります。

       ★ R18作品は r18: true にしてください。
       ================================================== -->

  <script>

    const illustrations = [

      /* ==================================================
         最新の作品をここに追加
         ==================================================

      {
        image: "images/illust02.JPG",
        category: "goofy-max",
        title: "2026.09.18",
        zoom: 1,
        x: 50,
        y: 50,
        r18: false
      },

      */


      /* ---------- 作品01 ---------- */

      {
        image: "images/illust01.JPG",

        /* ジャンル：
           "goofy-max" または "other" */
        category: "goofy-max",

        /* 作品タイトル */
        title: "2026.06.03",

        /* サムネイルの拡大率 */
        zoom: 3,

        /* サムネイルの左右位置
           0 = 左
           50 = 中央
           100 = 右 */
        x: 50,

        /* サムネイルの上下位置
           0 = 上
           50 = 中央
           100 = 下 */
        y: -30,

        /* R18作品なら true */
        r18: false
      },
      
      {
        image: "images/anst04.JPG",
        category: "other",
        title: "2022.05.08 あん☆/ひよジュン",
        zoom: 3,
        x: 130,
        y: -10,
        r18: false
      }


      /* ==================================================
         作品追加例

         最新の作品を一番上に追加します。

      ,
      {
        image: "images/illust03.JPG",
        category: "goofy-max",
        title: "2026.09.20",
        zoom: 1,
        x: 50,
        y: 50,
        r18: false
      }

         R18作品の場合：

      ,
      {
        image: "images/illust04.JPG",
        category: "goofy-max",
        title: "2026.09.21",
        zoom: 1.5,
        x: 50,
        y: 50,
        r18: true
      }

         ================================================== */

    ];

  </script>


  <style>

    :root {
      --bg: #f3f0e6;
      --mint: #a8cdbd;
      --green: #243b36;
      --blue: #456A72;
      --line: #b8c8bd;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--green);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      line-height: 1.8;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      opacity: 0.6;
    }


    /* ---------- header ---------- */

    header {
      background-color: var(--mint);

      background-image:
        radial-gradient(
          circle at 15% 25%,
          rgba(243, 240, 230, 0.45) 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 80% 70%,
          rgba(243, 240, 230, 0.35) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 65% 20%,
          rgba(243, 240, 230, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;

      padding: 65px 25px 45px;
      text-align: center;
    }

    .site-title {
      display: inline-block;
    }

    .site-title h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: normal;
      letter-spacing: 0.04em;
      color: var(--blue);
    }

    nav {
      margin-top: 35px;
      display: flex;
      gap: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    nav a {
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }


    /* ---------- main ---------- */

    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 70px 25px 100px;

      background-image:
        radial-gradient(
          circle at 12% 18%,
          rgba(168, 205, 189, 0.45) 0 2px,
          transparent 3px
        ),
        radial-gradient(
          circle at 86% 72%,
          rgba(168, 205, 189, 0.35) 0 3px,
          transparent 4px
        ),
        radial-gradient(
          circle at 65% 35%,
          rgba(168, 205, 189, 0.3) 0 1px,
          transparent 2px
        );

      background-size:
        180px 180px,
        240px 240px,
        130px 130px;
    }

    .page-title {
      margin-bottom: 40px;
    }

    .page-title h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 2rem;
      font-weight: normal;
      letter-spacing: 0.08em;
      color: var(--blue);
    }

    .page-title p {
      margin: 3px 0 0;
      color: var(--blue);
      font-size: 0.7rem;
    }


    /* ---------- category ---------- */

    .filters {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 45px;
    }

    .filter {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--blue);
      padding: 7px 16px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .filter:hover,
    .filter.active {
      background: var(--mint);
    }


    /* ---------- gallery ---------- */

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .work {
      margin: 0;
      cursor: pointer;
    }

    /* 正方形の枠 */

    .work-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background: #e8e5db;
      position: relative;
    }

    /* 枠の中で画像を拡大・移動 */

    .work-image {
      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position:
        var(--x, 50%)
        var(--y, 50%);

      transform:
        scale(var(--zoom, 1));

      display: block;

      transition:
        opacity 0.2s ease,
        filter 0.2s ease;
    }

    .work:hover .work-image {
      opacity: 0.75;
    }


    /* ---------- R18 thumbnail ---------- */

    .work.r18 .work-image {
      filter: blur(18px);
    }

    .work.r18:hover .work-image {
      opacity: 0.9;
    }

    .r18-label {
      position: absolute;
      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      z-index: 2;

      color: var(--bg);
      background: rgba(36, 59, 54, 0.8);

      padding: 6px 14px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.9rem;
      letter-spacing: 0.12em;
    }


    .work figcaption {
      padding-top: 8px;
      color: var(--blue);
      font-size: 0.72rem;
    }


    /* ---------- lightbox ---------- */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;

      display: none;
      align-items: center;
      justify-content: center;

      background: rgba(36, 59, 54, 0.88);
      padding: 30px;
    }

    .lightbox.show {
      display: flex;
    }

    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 90vh;

      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* 拡大表示では元画像をそのまま表示 */

    .lightbox-image {
      max-width: 82vw;
      max-height: 82vh;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }


    /* ---------- R18 confirmation ---------- */

    .r18-confirm {
      display: none;

      text-align: center;
      color: var(--bg);

      max-width: 400px;
      padding: 35px 30px;
    }

    .r18-confirm.show {
      display: block;
    }

    .r18-confirm h3 {
      margin: 0 0 18px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 1.6rem;
      font-weight: normal;
      letter-spacing: 0.12em;
    }

    .r18-confirm p {
      margin: 0 0 28px;
      font-size: 0.8rem;
      line-height: 2;
    }

    .r18-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .r18-button {
      border: 1px solid rgba(243, 240, 230, 0.7);
      background: transparent;
      color: var(--bg);

      padding: 8px 22px;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 0.8rem;
      letter-spacing: 0.08em;

      cursor: pointer;
    }

    .r18-button:hover {
      background: rgba(243, 240, 230, 0.15);
    }


    /* ---------- lightbox controls ---------- */

    .close {
      position: fixed;
      top: 20px;
      right: 25px;

      border: none;
      background: none;
      color: var(--bg);

      font-size: 2rem;
      font-weight: normal;
      cursor: pointer;

      z-index: 5;
    }

    .prev,
    .next {
      position: fixed;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: none;
      color: var(--bg);

      font-size: 2rem;
      cursor: pointer;
      padding: 20px;

      z-index: 5;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }


    /* ---------- footer ---------- */

    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 30px 25px 55px;

      border-top: 1px solid var(--line);

      color: var(--blue);

      font-size: 0.7rem;

      letter-spacing: 0.12em;
    }


    /* ---------- mobile ---------- */

    @media (max-width: 600px) {

      header {
        padding-top: 35px;
      }

      .site-title h1 {
        font-size: 2.4rem;
      }

      nav {
        gap: 18px;
      }

      main {
        padding-top: 50px;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .work figcaption {
        font-size: 0.68rem;
      }

      .lightbox {
        padding: 15px;
      }

      .lightbox-image {
        max-width: 90vw;
        max-height: 80vh;
      }

      .prev,
      .next {
        font-size: 1.5rem;
        padding: 10px;
      }

      .r18-confirm {
        padding: 30px 20px;
      }

    }

  </style>

</head>


<body>


  <header>

    <a href="index.html" class="site-title">
      <h1>ressentiment</h1>
    </a>

    <nav>

      <a href="illust.html">ILLUST</a>

      <a href="novel.html">NOVEL</a>

      <a href="blog.html">BLOG</a>

      <a href="circle.html">CIRCLE</a>

    </nav>

  </header>


  <main>


    <div class="page-title">

      <h2>ILLUST</h2>

      <p>新しい順に掲載／左上が最新</p>

    </div>


    <!-- category filter -->

    <div class="filters">

      <button
        class="filter active"
        data-filter="all"
      >
        ALL
      </button>

      <button
        class="filter"
        data-filter="goofy-max"
      >
        Goofy &amp; Max
      </button>

      <button
        class="filter"
        data-filter="other"
      >
        Other
      </button>

    </div>


    <!-- gallery -->

    <div
      class="gallery"
      id="gallery"
    ></div>


  </main>


  <!-- ==================================================
       lightbox
       ================================================== -->

  <div
    class="lightbox"
    id="lightbox"
  >

    <button
      class="close"
      id="close"
    >
      ×
    </button>


    <button
      class="prev"
      id="prev"
    >
      ‹
    </button>


    <div class="lightbox-content">

      <!-- 通常作品 -->

      <img
        src=""
        alt=""
        class="lightbox-image"
        id="lightbox-image"
      >


      <!-- R18確認画面 -->

      <div
        class="r18-confirm"
        id="r18-confirm"
      >

        <h3>R18</h3>

        <p>
          この作品には成人向け表現が含まれます。
        </p>

        <div class="r18-buttons">

          <button
            class="r18-button"
            id="r18-view"
          >
            見る
          </button>

          <button
            class="r18-button"
            id="r18-back"
          >
            戻る
          </button>

        </div>

      </div>

    </div>


    <button
      class="next"
      id="next"
    >
      ›
    </button>

  </div>


  <footer>

    © saneyoshi / ressentiment

  </footer>


  <script>

    /* ==================================================
       gallery creation
       ================================================== */

    const gallery =
      document.getElementById("gallery");


    illustrations.forEach((item, index) => {

      const figure =
        document.createElement("figure");

      figure.className = "work";

      if (item.r18) {
        figure.classList.add("r18");
      }

      figure.dataset.category =
        item.category;


      /* ---------- frame ---------- */

      const frame =
        document.createElement("div");

      frame.className = "work-frame";


      /* ---------- image ---------- */

      const image =
        document.createElement("img");

      image.src =
        item.image;

      image.alt =
        item.title;

      image.className =
        "work-image";


      image.style.setProperty(
        "--zoom",
        item.zoom
      );

      image.style.setProperty(
        "--x",
        item.x + "%"
      );

      image.style.setProperty(
        "--y",
        item.y + "%"
      );


      frame.appendChild(image);


      /* ---------- R18 label ---------- */

      if (item.r18) {

        const r18Label =
          document.createElement("div");

        r18Label.className =
          "r18-label";

        r18Label.textContent =
          "R18";

        frame.appendChild(r18Label);

      }


      /* ---------- caption ---------- */

      const caption =
        document.createElement("figcaption");

      caption.textContent =
        item.title;


      figure.appendChild(frame);

      figure.appendChild(caption);

      gallery.appendChild(figure);

    });


    /* ==================================================
       elements
       ================================================== */

    const works =
      Array.from(
        document.querySelectorAll(".work")
      );

    const filters =
      document.querySelectorAll(".filter");

    const lightbox =
      document.getElementById("lightbox");

    const lightboxImage =
      document.getElementById("lightbox-image");

    const r18Confirm =
      document.getElementById("r18-confirm");

    const r18View =
      document.getElementById("r18-view");

    const r18Back =
      document.getElementById("r18-back");

    const close =
      document.getElementById("close");

    const prev =
      document.getElementById("prev");

    const next =
      document.getElementById("next");


    let visibleWorks = works;

    let currentIndex = 0;


    /* ==================================================
       category filter
       ================================================== */

    filters.forEach(filter => {

      filter.addEventListener(
        "click",
        () => {

          filters.forEach(item => {

            item.classList.remove(
              "active"
            );

          });


          filter.classList.add(
            "active"
          );


          const category =
            filter.dataset.filter;


          works.forEach(work => {

            if (
              category === "all" ||
              work.dataset.category === category
            ) {

              work.style.display = "";

            } else {

              work.style.display = "none";

            }

          });


          visibleWorks =
            works.filter(work => {

              return (
                work.style.display !== "none"
              );

            });

        }
      );

    });


    /* ==================================================
       open lightbox
       ================================================== */

    works.forEach(work => {

      work.addEventListener(
        "click",
        () => {

          visibleWorks =
            works.filter(item => {

              return (
                item.style.display !== "none"
              );

            });


          currentIndex =
            visibleWorks.indexOf(work);


          showCurrentWork();


          lightbox.classList.add(
            "show"
          );


          document.body.style.overflow =
            "hidden";

        }
      );

    });


    /* ==================================================
       show current work
       ================================================== */

    function showCurrentWork() {

      const work =
        visibleWorks[currentIndex];


      if (!work) {
        return;
      }


      const image =
        work.querySelector(".work-image");


      const isR18 =
        work.classList.contains("r18");


      if (isR18) {

        /* R18は画像を隠して確認画面を表示 */

        lightboxImage.style.display =
          "none";

        r18Confirm.classList.add(
          "show"
        );

      } else {

        /* 通常作品 */

        r18Confirm.classList.remove(
          "show"
        );

        lightboxImage.style.display =
          "block";

        lightboxImage.src =
          image.src;

        lightboxImage.alt =
          image.alt;

      }

    }


    /* ==================================================
       show R18 image
       ================================================== */

    r18View.addEventListener(
      "click",
      () => {

        const work =
          visibleWorks[currentIndex];


        if (!work) {
          return;
        }


        const image =
          work.querySelector(".work-image");


        lightboxImage.src =
          image.src;

        lightboxImage.alt =
          image.alt;


        r18Confirm.classList.remove(
          "show"
        );

        lightboxImage.style.display =
          "block";

      }
    );


    /* ==================================================
       R18 back
       ================================================== */

    r18Back.addEventListener(
      "click",
      () => {

        closeLightbox();

      }
    );


    /* ==================================================
       close
       ================================================== */

    close.addEventListener(
      "click",
      closeLightbox
    );


    lightbox.addEventListener(
      "click",
      event => {

        if (
          event.target === lightbox
        ) {

          closeLightbox();

        }

      }
    );


    function closeLightbox() {

      lightbox.classList.remove(
        "show"
      );

      r18Confirm.classList.remove(
        "show"
      );

      lightboxImage.style.display =
        "block";

      lightboxImage.src =
        "";

      document.body.style.overflow =
        "";

    }


    /* ==================================================
       previous
       ================================================== */

    prev.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (
          visibleWorks.length === 0
        ) {

          return;

        }


        currentIndex =
          (
            currentIndex
            - 1
            + visibleWorks.length
          )
          % visibleWorks.length;


        showCurrentWork();

      }
    );


    /* ==================================================
       next
       ================================================== */

    next.addEventListener(
      "click",
      event => {

        event.stopPropagation();


        if (
          visibleWorks.length === 0
        ) {

          return;

        }


        currentIndex =
          (
            currentIndex
            + 1
          )
          % visibleWorks.length;


        showCurrentWork();

      }
    );


    /* ==================================================
       keyboard
       ================================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          !lightbox.classList.contains(
            "show"
          )
        ) {

          return;

        }


        if (
          event.key === "Escape"
        ) {

          closeLightbox();

        }


        if (
          event.key === "ArrowLeft"
        ) {

          prev.click();

        }


        if (
          event.key === "ArrowRight"
        ) {

          next.click();

        }

      }
    );

  </script>


</body>
</html>
