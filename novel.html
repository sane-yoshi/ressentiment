  <!-- ==================================================
       小説データ

       ★ 小説を追加するときは、ここだけ編集 ★
       新しい作品を一番上に追加してください。

       category：
       "goofy-max" または "other"

       file：
       本文ファイルの場所
       例）novels/novel01.txt

       paging：
       true  = ページ送りあり
       false = 全文を1ページで表示

       r18：
       true  = R18確認画面あり
       false = そのまま本文へ
       ================================================== -->

        date: "2026.10.02",
        description: "グマクグ/全年齢",

      },


      /* ---------- 作品02 ---------- */

      {

        category: "goofy-max",
        date: "2026.10.01",
        description: "グマクグ/全年齢",
        file: "novels/novel04.txt",
        paging: false,
        r18: false
      },


      /* ---------- 作品03 ---------- */

      {
        title: "月光",
        category: "other",
        date: "2025.05.22",
        description: "FE/リュ♂ディア/R18",
        file: "novels/novel03.txt",
        paging: true,
        r18: true
      },


      /* ---------- 作品04 ---------- */

      {
        title: "存在証明",
        category: "other",
        date: "2025.05.14",
        description: "FE/スタリュ♂/R18",
        file: "novels/novel02.txt",

      },


      /* ---------- 作品05 ---------- */

      {
        title: "夜明け",
        category: "other",
        date: "2022.12.04",
        description: "新弾丸論破V3/最キボ/全年齢",
        file: "novels/novel01.txt",
        paging: false,
        r18: false
      }


      /* ---------- 小説を追加する場合 ----------

      上の } の後ろに「,」を付けて、

      {
        title: "新しい小説",
        category: "goofy-max",
        date: "2026.09.20",
        description: "作品の説明",
        file: "novels/novel06.txt",

      paging:
      true  → ページ送りあり
      false → 全文表示

      r18:
      true  → R18確認画面あり
      false → そのまま本文へ

      ------------------------------------------ */

    ];

  </script>

    /* ---------- gender symbol ---------- */

    /* ==================================================

    .r18-confirm {

  <!-- ==================================================
       R18 confirmation

  <div

  >

    <div class="r18-confirm-content">

      <h3>R18</h3>


      <p>
        この作品には成人向け表現が含まれます。
      </p>


      <div class="r18-buttons">


        <button
          class="r18-button"

        >

  </div>


  <footer>

  <script>


    /* ==================================================
       文字数取得
       ================================================== */

    async function getCharacterCount(
      file
    ) {

      try {

        const response =
          await fetch(file);


        if (!response.ok) {

          throw new Error(
            "File not found"
          );

        }


        const text =
          await response.text();


        /*
         * 改行とページ区切りだけ除外。
         * 全角スペースなど本文中の空白は
         * 文字数としてカウントする。
         */

        return text
          .replace(
            /===PAGE===/g,
            ""
          )
          .replace(
            /\r?\n/g,
            ""
          )
          .length;


      } catch (error) {

        console.error(
          "文字数を取得できませんでした:",
          file,
          error
        );

        return null;

      }

    }


    /* ==================================================
       小説一覧を作成
       ================================================== */

    const novelList =
      document.getElementById(
        "novel-list"
      );


    /*
     * 説明文の中にある ♂ / ♀ を
     * 自動的に専用の span に入れる。
     */

    function createDescription(
      text
    ) {

      const description =
        document.createElement(
          "div"
        );


      description.className =
        "novel-description";


      const parts =
        text.split(
          /([♂♀])/g
        );


      parts.forEach(
        part => {

          if (
            part === "♂" ||
            part === "♀"
          ) {

            const symbol =
              document.createElement(
                "span"
              );


            symbol.className =
              "gender-symbol";


            symbol.textContent =
              part;


            description.appendChild(
              symbol
            );


          } else {

            description.appendChild(
              document.createTextNode(
                part
              )
            );

          }

        }
      );


      return description;

    }


    /* ==================================================
       R18 confirmation
       ================================================== */

    const r18Confirm =
      document.getElementById(
        "r18-confirm"
      );


    const r18View =
      document.getElementById(
        "r18-view"
      );


    const r18Back =
      document.getElementById(
        "r18-back"
      );


    let pendingNovel = null;


    /* ==================================================
       小説を開く
       ================================================== */

    function openNovel(
      novel
    ) {

      const params =
        new URLSearchParams();


      params.set(
        "file",
        novel.file
      );


      params.set(
        "title",
        novel.title
      );


      params.set(
        "date",
        novel.date
      );


      params.set(
        "category",
        novel.category
      );


      params.set(
        "paging",
        novel.paging
      );


      window.location.href =
        "novel-viewer.html?" +
        params.toString();

    }


    /* ==================================================
       小説を一覧に追加
       ================================================== */

    novels.forEach(
      novel => {

        const article =
          document.createElement(
            "article"
          );


        article.className =
          "novel";


        article.dataset.category =
          novel.category;


        const date =
          document.createElement(
            "div"
          );


        date.className =
          "novel-date";


        date.textContent =
          novel.date;


        const title =
          document.createElement(
            "div"
          );


        title.className =
          "novel-title";


        title.textContent =
          novel.title;


        const info =
          document.createElement(
            "div"
          );


        info.className =
          "novel-info";


        const category =
          document.createElement(
            "span"
          );


        category.className =
          "novel-category";


        if (
          novel.category ===
          "goofy-max"
        ) {

          category.textContent =
            "Goofy & Max";

        } else {

          category.textContent =
            "Other";

        }


        info.appendChild(
          category
        );


        /*
         * 文字数を表示
         */

        const count =
          document.createElement(
            "span"
          );


        count.className =
          "novel-count";


        count.textContent =
          "文字数を取得中…";


        info.appendChild(
          count
        );


        getCharacterCount(
          novel.file
        ).then(
          length => {

            if (
              length !== null
            ) {

              count.textContent =
                length.toLocaleString() +
                "字";

            } else {

              count.textContent =
                "";

            }

          }
        );


        /*
         * 説明文を作成
         */

        const description =
          createDescription(
            novel.description
          );


        article.appendChild(
          date
        );


        article.appendChild(
          title
        );


        article.appendChild(
          info
        );


        article.appendChild(
          description
        );


        /* ---------- 本文ページへ ---------- */

        article.addEventListener(
          "click",
          () => {

            /*
             * R18作品なら
             * 確認画面を表示。
             */

            if (
              novel.r18
            ) {

              pendingNovel =
                novel;


              r18Confirm.classList.add(
                "show"
              );


              document.body.style.overflow =
                "hidden";


              return;

            }


            openNovel(
              novel
            );

          }
        );


        novelList.appendChild(
          article
        );

      }
    );


    /* ==================================================
       R18：読む
       ================================================== */

    r18View.addEventListener(
      "click",
      () => {

        if (
          !pendingNovel
        ) {

          return;

        }


        const novel =
          pendingNovel;


        pendingNovel =
          null;


        r18Confirm.classList.remove(
          "show"
        );


        document.body.style.overflow =
          "";


        openNovel(
          novel
        );

      }
    );


    /* ==================================================
       R18：戻る
       ================================================== */

    r18Back.addEventListener(
      "click",
      () => {

        r18Confirm.classList.remove(
          "show"
        );


        pendingNovel =
          null;


        document.body.style.overflow =
          "";

      }
    );


    /* ==================================================
       category filter
       ================================================== */

    const filters =
      document.querySelectorAll(
        ".filter"
      );


    const novelsOnPage =
      Array.from(
        document.querySelectorAll(
          ".novel"
        )
      );


    filters.forEach(
      filter => {

        filter.addEventListener(
          "click",
          () => {


            filters.forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


            filter.classList.add(
              "active"
            );


            const selectedCategory =
              filter.dataset.filter;


            novelsOnPage.forEach(
              novel => {

                if (
                  selectedCategory ===
                    "all" ||
                  novel.dataset.category ===
                    selectedCategory
                ) {

                  novel.style.display =
                    "";

                } else {

                  novel.style.display =
                    "none";

                }

              }
            );

          }
        );

      }
    );

  </script>
